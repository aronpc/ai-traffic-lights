name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # os testes não iniciam o Electron — pula o download do binário (~100MB)
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          # glob cobre hooks futuros; os instaladores são nomeados um a um
          for f in hooks/*.sh install.sh install_macos.sh; do bash -n "$f"; done
          node --check main.js preload.js
          for f in src/*.js scripts/*.js adapters/*/ai-traffic-lights.js; do node --check "$f"; done
      - name: Tests
        run: npm test
