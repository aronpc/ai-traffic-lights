name: Release

# Disparo MANUAL apenas (Actions → Release → Run workflow).
#
# Não usamos gatilho por push de tag de propósito: o `scripts/release.sh` cria a
# release via `gh` (que por sua vez cria a tag), então um gatilho `push: tags`
# faria o workflow reagir à sua própria publicação e gerar release duplicada.
#
# O workflow não reimplementa nada — roda o MESMO script do fluxo local, para
# que build no CI e build na máquina do mantenedor não possam divergir.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "beta = pre-release isolada · promote = vira o Latest de todo mundo"
        type: choice
        options: [beta, promote]
        default: beta
      base:
        description: "modo beta: versão base X.Y.Z (vazio = patch+1 do package.json)"
        type: string
        required: false
      version:
        description: "modo promote: versão X.Y.Z (vazio = último -beta.N sem o sufixo)"
        type: string
        required: false
      dry_run:
        description: "Só mostrar o que faria, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write   # criar release + tag + upload de artefatos

jobs:
  # ---------------------------------------------------------------------------
  # Job Linux — compila AppImage + .deb e cria a release no GitHub.
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release.sh lê git log entre tags e checa branches remotos

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # node-pty é módulo nativo: precisa compilar contra os headers do Electron.
      # O runner já traz build-essential e python3; libarchive-tools é o que falta
      # para o empacotamento AppImage do electron-builder.
      - name: Dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools

      - run: npm ci

      - name: Syntax checks
        run: |
          bash -n hooks/traffic-hook.sh
          bash -n scripts/release.sh
          node --check main.js preload.js
          for f in src/*.js scripts/*.js; do node --check "$f"; done

      # Os inputs entram por env, não interpolados no shell: `base`/`version` são
      # strings livres e ${{ }} direto num `run` é injeção de comando.
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_MODE: ${{ inputs.mode }}
          IN_BASE: ${{ inputs.base }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          args=("$IN_MODE")
          if [ -n "$IN_BASE" ];    then args+=(--base "$IN_BASE"); fi
          if [ -n "$IN_VERSION" ]; then args+=(--version "$IN_VERSION"); fi
          if [ "$IN_DRY" = "true" ]; then args+=(--dry-run); fi
          bash scripts/release.sh "${args[@]}"

  # ---------------------------------------------------------------------------
  # Job macOS — compila .dmg + .zip (arm64) e faz upload para a release criada
  # pelo job Linux. Roda em paralelo; o modo `upload-mac` do release.sh aguarda
  # a release existir antes de tentar o upload (retry com timeout de 5 min).
  # Só executado no modo `promote` (betas são Linux-only).
  # ---------------------------------------------------------------------------
  build-mac:
    runs-on: macos-latest
    if: ${{ inputs.mode == 'promote' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build macOS e upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          args=(upload-mac)
          if [ -n "$IN_VERSION" ]; then args+=(--version "$IN_VERSION"); fi
          if [ "$IN_DRY" = "true" ]; then args+=(--dry-run); fi
          bash scripts/release.sh "${args[@]}"
